<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Caras 3D</title>
<style>
body{margin:0;background:#000;color:#eee;font-family:-apple-system,sans-serif;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 6px}
p{color:#8e8e93;font-size:14px;line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:end;margin-top:28px}
figure{margin:0;text-align:center}
figcaption{font-size:12px;color:#8e8e93;margin-top:8px}
.eye,.eye-white{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s var(--blink,0s) infinite}
.eye{fill:#171717}
.wink-left .eye-l,.wink-right .eye-r{animation:blink 5s var(--blink,0s) infinite,wink 7.5s var(--blink,0s) infinite}
@keyframes blink{0%,86%,100%{transform:scaleY(1)}88%,91%{transform:scaleY(.08)}}
@keyframes wink{0%,38%,46%,100%{transform:scaleY(1)}41%,43%{transform:scaleY(.08)}}
</style>
</head>
<body>
<h1>Así se ven en 3D</h1>
<p>Brillo, sombra, ojitos que se cierran y boquita. Esperá unos segundos.</p>
<div class="row" id="faces"></div>
<script src="https://cdn.jsdelivr.net/gh/Eliezer1817/equipo-agentes@main/web/avatar.js"></script>
<script>
const items=[
  {id:"jefe",name:"Jefe",color:"#f97316",shape:"hex"},
  {id:"max",name:"Max",color:"#f59e0b",shape:"drop"},
  {id:"vellum",name:"Vellum",color:"#38bdf8",shape:"cloud"},
  {id:"nexus",name:"Nexus",color:"#2dd4bf",shape:"circle"},
  {id:"cyber",name:"Cybertron",color:"#a78bfa",shape:"blob"},
  {id:"luna",name:"Luna",color:"#fb7185",shape:"squircle"},
];
document.getElementById("faces").innerHTML=
  items.map(s=>`<figure>${buddySvg(s,96)}<figcaption>${s.name}</figcaption></figure>`).join("")+
  `<figure>${packSvg(items,108)}<figcaption>Grupo</figcaption></figure>`;
</script>
</body>
</html>
