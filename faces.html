<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caras del equipo</title>
  <style>
    body { margin:0; background:#000; color:#eee; font-family:-apple-system,sans-serif; padding:24px 16px 48px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#8e8e93; font-size:14px; line-height:1.4; }
    .row { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; margin:28px 0; }
    figure { margin:0; text-align:center; }
    figcaption { font-size:12px; color:#8e8e93; margin-top:6px; }
    .eye { fill:#171717; transform-box:fill-box; transform-origin:50% 50%; animation:blink 5s var(--blink,0s) infinite; }
    .wink-left .eye-l, .wink-right .eye-r { animation: blink 5s var(--blink,0s) infinite, wink 7.5s var(--blink,0s) infinite; }
    @keyframes blink { 0%,86%,100%{transform:scaleY(1)} 88%,91%{transform:scaleY(.08)} }
    @keyframes wink { 0%,38%,46%,100%{transform:scaleY(1)} 41%,43%{transform:scaleY(.08)} }
  </style>
</head>
<body>
  <h1>Así parpadean</h1>
  <p>Ojos que se cierran y boquita. El racimo es el grupo. Esperá 2–5 segundos.</p>
  <div class="row" id="faces"></div>
  <script>
    const BODY = {
      hex: "M12 2.2 20.4 7v10L12 21.8 3.6 17V7Z",
      drop: "M12 2.4C12 2.4 5.2 10.2 5.2 15a6.8 6.8 0 0 0 13.6 0C18.8 10.2 12 2.4 12 2.4Z",
      cloud: "M8 10.2a3.6 3.6 0 0 1 3.3-2.4 4.2 4.2 0 0 1 4.2 3.4A3.4 3.4 0 0 1 18.6 17H6.6A3.3 3.3 0 0 1 8 10.2Z",
      circle: "M12 3.2a8.8 8.8 0 1 1 0 17.6 8.8 8.8 0 0 1 0-17.6Z",
      blob: "M8.2 5.4c2.4-2 6.4-2.2 8.8.2 2.2 2.2 2.4 5.6.8 8.2-1.4 2.2-1 4.6-3.2 5.8-2.6 1.4-6 .6-8-1.4-2.2-2.2-2.8-5.8-1.6-8.4 1-2.2 1.4-3.2 3.2-4.4Z",
      squircle: "M7 3.4h10c2.4 0 3.6 1.2 3.6 3.6v10c0 2.4-1.2 3.6-3.6 3.6H7c-2.4 0-3.6-1.2-3.6-3.6V7c0-2.4 1.2-3.6 3.6-3.6Z",
    };
    const items = [
      ["hex","#f97316","Jefe"],
      ["drop","#f59e0b","Max"],
      ["cloud","#38bdf8","Vellum"],
      ["circle","#2dd4bf","Nexus"],
      ["blob","#a78bfa","Cybertron"],
      ["squircle","#fb7185","Luna"],
    ];
    function face(shape, color, id, size) {
      const wink = id % 2 ? "wink-left" : "wink-right";
      return `<svg class="buddy" viewBox="0 0 24 24" width="${size}" height="${size}">
        <g class="${wink}" style="--blink:${id * .4}s">
          <path fill="${color}" d="${BODY[shape]}"/>
          <ellipse class="eye eye-l" cx="9.2" cy="11.2" rx="1.35" ry="1.7"/>
          <ellipse class="eye eye-r" cx="14.8" cy="11.2" rx="1.35" ry="1.7"/>
          <path d="M10 14.7c.7 1.1 3.3 1.1 4 0" fill="none" stroke="#171717" stroke-width="1.15" stroke-linecap="round"/>
        </g></svg>`;
    }
    const pack = `<svg viewBox="0 0 24 24" width="92" height="92">
      <g transform="translate(1 2) scale(.58)">${face("hex","#f97316",1,24).replace(/<\/?svg[^>]*>/g,"")}</g>
      <g transform="translate(11 1) scale(.54)">${face("drop","#f59e0b",2,24).replace(/<\/?svg[^>]*>/g,"")}</g>
      <g transform="translate(2 11) scale(.5)">${face("cloud","#38bdf8",3,24).replace(/<\/?svg[^>]*>/g,"")}</g>
      <g transform="translate(12 12) scale(.46)">${face("circle","#2dd4bf",4,24).replace(/<\/?svg[^>]*>/g,"")}</g>
    </svg>`;
    document.getElementById("faces").innerHTML =
      items.map(([s,c,n],i) => `<figure>${face(s,c,i,88)}<figcaption>${n}</figcaption></figure>`).join("") +
      `<figure>${pack}<figcaption>Grupo</figcaption></figure>`;
  </script>
</body>
</html>
